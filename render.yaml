services:
  - type: web
    name: estore-api
    env: python
    plan: free
    region: oregon
    buildCommand: "./build.sh"
    startCommand: "gunicorn estore.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: estore-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: WEB_CONCURRENCY
        value: 4
      - key: REDIS_URL
        fromService:
          type: redis
          name: estore-redis
          property: connectionString

  - type: worker
    name: estore-worker
    env: python
    plan: starter
    region: oregon
    buildCommand: "./build.sh"
    startCommand: "celery -A estore worker -l info --concurrency 2"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: estore-db
          property: connectionString
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: "False"
      - key: REDIS_URL
        fromService:
          type: redis
          name: estore-redis
          property: connectionString
      - key: RESEND_API_KEY
        sync: false
      - key: SENDER_EMAIL
        sync: false

  - type: redis
    name: estore-redis
    plan: free
    region: oregon
    ipAllowList: []

databases:
  - name: estore-db
    plan: free
    region: oregon
