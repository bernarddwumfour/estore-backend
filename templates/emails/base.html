<!DOCTYPE html>
<html>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333; background: #f4f4f4; margin: 0; padding: 20px 0;">
    <div style="max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 8px; padding: 30px;">
        <h2 style="color: #333; margin-top: 0;">{% block heading %}{% endblock %}</h2>
        <p>Hello <strong>{{ recipient_name|default:"there" }}</strong>,</p>
        {% block content %}{% endblock %}
        <hr style="border: none; border-top: 1px solid #eee; margin: 20px 0;">
        <p style="color: #888; font-size: 14px;">Best regards,<br>
        <strong>{{ site_name }} Team</strong></p>
    </div>
</body>
</html>
